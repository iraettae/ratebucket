default_install_hook_types: [pre-commit, pre-push]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # `ruff-check` is the current id; `ruff` still works but is a legacy alias.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Must come after ruff-check: lint autofixes can emit unformatted code, and
      # pre-commit runs hooks in the order they are listed.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.28" # modern uv-pre-commit tags carry no leading `v`
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # mypy runs against the project's real environment, not a pre-commit venv.
  #
  # pre-commit/mirrors-mypy bakes `--ignore-missing-imports` into its default args
  # and installs mypy into an isolated venv holding nothing but mypy. Every
  # third-party import then resolves to nothing, and because missing imports are
  # ignored, mypy types those modules as Any. Under `strict = true` it then checks
  # Any against Any and reports success. The hook is green. Nothing is checked.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project env via uv)
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false # let [tool.mypy] files decide, so it stays whole-program
        require_serial: true
