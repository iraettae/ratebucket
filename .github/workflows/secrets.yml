name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Mandatory. checkout defaults to a one-commit shallow clone, and a
          # full-history secret scan over a one-commit history exits 0 and finds
          # nothing. That is a green job that scans nothing, which is worse than
          # no job at all.
          fetch-depth: 0

      # Deliberately not gitleaks/gitleaks-action: as of v3.0.0 it still shells
      # into `gitleaks detect`, a subcommand upstream deprecated and hid from
      # --help in v8.19.0. Running the binary against the supported `git`
      # subcommand is one fewer moving part and one fewer thing to be wrong about.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/
          gitleaks version

      # No --log-opts means every commit. `gitleaks dir` would scan the working
      # tree instead, and pass.
      - name: Scan every commit
        run: gitleaks git --no-banner --redact --exit-code 1 .
