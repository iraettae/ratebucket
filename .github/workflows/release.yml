# The filename of this file is registered with PyPI and TestPyPI as part of the
# trusted publisher identity. Renaming it breaks publishing, and only at the tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv build
      - name: twine check --strict
        run: uv run --with twine twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ratebucket
    # Only the publishing job gets id-token, never the workflow as a whole, and
    # never the job that builds the artifact it publishes.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: [testpypi]
    runs-on: ubuntu-latest
    # The `pypi` environment carries a required reviewer. This job therefore sits
    # and waits until a human presses Approve. That human is the only one who
    # decides what lands on the real index. 0.0.1 is a dress rehearsal for the
    # pipeline and is never approved.
    environment:
      name: pypi
      url: https://pypi.org/p/ratebucket
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
